<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #f8dede;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: #556b4e;
            padding: 1rem;
            color: white;
            text-align: center;
            font-size: 1.5rem;
        }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        h1 {
            color: #c93c64;
            margin-bottom: 1rem;
        }
        
        ul {
            list-style: none;
            padding: 0;
        }
        
        ul li {
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            color: #333;
        }
        
        a {
            background: #556b4e;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            transition: 0.3s;
        }
        
        a:hover {
            background: #3c5036;
        }
        
        footer {
            background: #556b4e;
            color: white;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <header>💐 Services</header>
    <main>
        <h1>Our Services</h1>
        <ul>
            <li>✔ Fresh flower bouquets</li>
            <li>✔ Wedding & Event decorations</li>
            <li>✔ Online flower delivery</li>
        </ul>
        <a href="index.html">⬅ Back to Main</a>
    </main>
    <footer>© 2025 Only Flowers</footer>
</body>

</html>
