<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #f8dede;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: #556b4e;
            padding: 1rem;
            color: white;
            text-align: center;
            font-size: 1.5rem;
        }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        h1 {
            color: #c93c64;
            margin-bottom: 1rem;
        }
        
        form {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        label {
            display: block;
            margin-top: 10px;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        button {
            margin-top: 15px;
            background: #556b4e;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        
        button:hover {
            background: #3c5036;
        }
        
        a {
            display: inline-block;
            margin-top: 1rem;
            text-decoration: none;
            color: #556b4e;
        }
        
        a:hover {
            color: #c93c64;
        }
        
        footer {
            background: #556b4e;
            color: white;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <header>🔐 Login</header>
    <main>
        <h1>Login to Only Flowers</h1>
        <form>
            <label>Email:</label>
            <input type="email" required>
            <label>Password:</label>
            <input type="password" required>
            <button type="submit">Login</button>
        </form>
        <a href="index.html">⬅ Back to Main</a>
    </main>
    <footer>© 2025 Only Flowers</footer>
</body>

</html>
